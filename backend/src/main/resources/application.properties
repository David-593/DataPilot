spring.application.name=datapilot-api
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/datapilot}
spring.datasource.username=${DB_USERNAME:datapilot}
spring.datasource.password=${DB_PASSWORD:datapilot_dev}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
